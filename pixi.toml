[workspace]
name = "mt3d-usgs"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[tasks]
get-ostag = "python -c 'from modflow_devtools.ostags import get_ostag; print(get_ostag())'"
clean = "rm -rf builddir"
setup = "meson setup --prefix=$(pwd) --libdir=bin"
build = "meson install -C"
test = "meson test --verbose --no-rebuild -C"

[dependencies]
meson = ">=1.3.1"
ninja = "*"
python = ">=3.9"
modflow-devtools = "*"
